[project]
name = "espocrm-mcp"
version = "0.2.0"
description = "MCP server exposing the EspoCRM REST API as tools, adapted and verified against EspoCRM 7.5.6"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Dominik Szymański", email = "dominik@przyszloscjestdzisiaj.pl" },
]
keywords = ["espocrm", "mcp", "claude", "crm", "ai", "7.5.6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Groupware",
]
dependencies = [
  "mcp>=1.0.0,<2.0.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/przyszloscjestdzisiaj/espocrm-mcp"
Repository = "https://github.com/przyszloscjestdzisiaj/espocrm-mcp"
Issues = "https://github.com/przyszloscjestdzisiaj/espocrm-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the server module ships: tests, scripts and docs stay in the repository.
# Verified by building the wheel and listing its contents.
only-include = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
